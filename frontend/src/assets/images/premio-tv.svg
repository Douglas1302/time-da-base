<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Imagem ilustrativa de uma smart TV">
  <defs>
    <linearGradient id="tvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="60%" stop-color="#0B1738"/>
      <stop offset="100%" stop-color="#244FE0"/>
    </linearGradient>
    <linearGradient id="tvScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#1B348F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#tvBg)"/>
  <circle cx="1010" cy="640" r="230" fill="#3B6BF5" opacity="0.25"/>
  <circle cx="220" cy="200" r="180" fill="#34D399" opacity="0.16"/>
  <g transform="translate(330,180)">
    <rect x="0" y="0" width="540" height="330" rx="18" fill="#040C18" stroke="#95B7FF" stroke-width="8"/>
    <rect x="18" y="18" width="504" height="294" rx="10" fill="url(#tvScreen)"/>
    <rect x="230" y="330" width="80" height="70" fill="#95B7FF" opacity="0.7"/>
    <rect x="150" y="396" width="240" height="20" rx="10" fill="#E8EFFB" opacity="0.8"/>
  </g>
  <g fill="#F8FAFC" font-family="Outfit, Inter, sans-serif">
    <text x="80" y="130" font-size="34" letter-spacing="6" opacity="0.7">PRÊMIO PRINCIPAL</text>
    <text x="80" y="212" font-size="76" font-weight="700">SMART TV</text>
    <text x="80" y="262" font-size="30" opacity="0.75">Imagem ilustrativa do prêmio</text>
  </g>
</svg>
