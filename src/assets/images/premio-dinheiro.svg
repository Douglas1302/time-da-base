<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Imagem ilustrativa de prêmio em dinheiro">
  <defs>
    <linearGradient id="cashBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#16324C"/>
      <stop offset="100%" stop-color="#05603A"/>
    </linearGradient>
    <linearGradient id="cashNote" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A6F4C5"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cashBg)"/>
  <circle cx="950" cy="170" r="240" fill="#34D399" opacity="0.22"/>
  <circle cx="230" cy="670" r="220" fill="#FBBF24" opacity="0.16"/>
  <g transform="translate(340,250)">
    <rect x="0" y="150" width="520" height="250" rx="26" fill="url(#cashNote)" opacity="0.55" transform="rotate(-7 260 275)"/>
    <rect x="20" y="90" width="520" height="250" rx="26" fill="url(#cashNote)" opacity="0.8" transform="rotate(-3 280 215)"/>
    <rect x="40" y="30" width="520" height="250" rx="26" fill="#ECFDF3" stroke="#079455" stroke-width="8"/>
    <circle cx="300" cy="155" r="62" fill="none" stroke="#079455" stroke-width="10" opacity="0.6"/>
    <text x="300" y="180" text-anchor="middle" font-family="Outfit, Inter, sans-serif" font-size="58" font-weight="700" fill="#05603A">R$</text>
  </g>
  <g fill="#F8FAFC" font-family="Outfit, Inter, sans-serif">
    <text x="80" y="130" font-size="34" letter-spacing="6" opacity="0.7">PRÊMIO PRINCIPAL</text>
    <text x="80" y="212" font-size="76" font-weight="700">EM DINHEIRO</text>
    <text x="80" y="262" font-size="30" opacity="0.75">Imagem ilustrativa do prêmio</text>
  </g>
</svg>
